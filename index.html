    <!-- Game Display Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link href="https://fonts.googleapis.com/css2?family=Righteous&family=Space+Grotesk:wght@500;700;800;900&display=swap" rel="stylesheet" />

    <style>
      /* Keep this reset inside a cascade layer. An unlayered reset beats every
         layered rule, and Tailwind puts all its utilities in @layer utilities -
         so an unlayered * { margin: 0; padding: 0 } silently zeroes every p-*,
         px-*, py-*, m-*, mt-*, mb-* utility in the app. */
      @layer base {
        *, *::before, *::after {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }
      }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #D6E6F2;
        font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        /* manipulation, not none: the page cannot scroll anyway (overflow hidden
           above), and this keeps pinch-to-zoom available. */
        touch-action: manipulation;
      }
      #root {
        width: 100%;
        height: 100%;
      }
      .font-game {
        font-family: 'Righteous', 'Space Grotesk', system-ui, sans-serif;
      }
      .font-ui {
        font-family: 'Space Grotesk', system-ui, sans-serif;
      }

      /* Keyboard focus has to be visible on a game that is mostly played with keys. */
      button:focus-visible {
        outline: 3px solid #17181C;
        outline-offset: 3px;
      }

      /* Nothing in the game is motionless, so honour the preference where it counts. */
      @media (prefers-reduced-motion: reduce) {
        .animate-pulse,
        .animate-bounce {
          animation: none !important;
        }
      }

      /* The first paint. This markup is inside #root, so React replaces it the moment
         the app mounts — it exists so a visitor on a slow connection sees a loading
         shore instead of an empty blue page while the bundle parses. */
      .boot {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #D4E8F8;
      }
      .boot-title {
        font-family: 'Righteous', 'Space Grotesk', system-ui, sans-serif;
        font-size: 34px;
        letter-spacing: 0.16em;
        color: #17181C;
        margin-bottom: 14px;
      }
      .boot-bar {
        width: 208px;
        height: 16px;
        background: #FDFBF7;
        border: 2px solid #17181C;
        border-radius: 8px;
        padding: 2px;
        box-shadow: 0 4px 0 #17181C;
      }
      .boot-bar span {
        display: block;
        height: 100%;
        width: 40%;
        background: #24698F;
        border-radius: 3px;
        animation: bootSlide 1.1s ease-in-out infinite;
      }
      .boot-note {
        font-family: 'Space Grotesk', system-ui, sans-serif;
        font-size: 11px;
        font-weight: 900;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #24698F;
        margin-top: 16px;
      }
      @keyframes bootSlide {
        0% { transform: translateX(0); }
        50% { transform: translateX(150%); }
        100% { transform: translateX(0); }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-bar span {
          animation: none;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot">
        <div class="boot-title">WRACKLINE</div>
        <div class="boot-bar"><span></span></div>
        <div class="boot-note">Loading the shore</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>

    <style>
      /* Keep this reset inside a cascade layer. An unlayered reset beats every
         layered rule, and Tailwind puts all its utilities in @layer utilities -
         so an unlayered * { margin: 0; padding: 0 } silently zeroes every p-*,
         px-*, py-*, m-*, mt-*, mb-* utility in the app. */
      @layer base {
        *, *::before, *::after {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }
      }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #D6E6F2;
        font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        touch-action: none;
      }
      #root {
        width: 100%;
        height: 100%;
      }
      .font-game {
        font-family: 'Righteous', 'Space Grotesk', system-ui, sans-serif;
      }
      .font-ui {
        font-family: 'Space Grotesk', system-ui, sans-serif;
      }
    </style>
